apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: order-service
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  strategy: {}
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - image: order-service:latest
          name: order-service
          imagePullPolicy: Never
          ports:
          - containerPort: 3002
          resources: {}
