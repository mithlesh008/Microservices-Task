apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gateway-service
  name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  strategy: {}
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - image: gateway-service:latest
          name: gateway-service
          imagePullPolicy: Never
          ports:
          - containerPort: 3003
          resources: {}
