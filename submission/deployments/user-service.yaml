apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: user-service
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  strategy: {}
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - image: user-service:latest
          name: user-service
          imagePullPolicy: Never
          ports:
          - containerPort: 3000
          resources: {}
